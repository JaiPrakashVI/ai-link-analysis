# ==============================================================================
# Render Infrastructure as Code (IaC) Blueprint Specification
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: ai-link-analysis
    runtime: python
    region: oregon # or ohio, frankfurt, singapore
    plan: free     # or starter, standard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false # Prompts securely in Render dashboard without exposing secret in Git
      - key: PRIMARY_MODEL
        value: gemini-2.5-flash
      - key: FALLBACK_MODEL
        value: gemini-2.5-flash-lite
      - key: CACHE_TTL_SECONDS
        value: "3600"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "15.0"
      - key: MAX_CONTENT_CHARS
        value: "15000"
